# ============================================================
# FLUENT BIT CONFIGMAP — THE POSTAL WORKER'S INSTRUCTION BOOK
#
# This ConfigMap holds Fluent Bit's entire configuration.
# Fluent Bit reads this file when it starts up.
#
# Analogy:
#   Think of this as the postal worker's job description:
#     INPUT:  "Pick up mail from these mailboxes" (read log files from disk)
#     FILTER: "Sort mail by who sent it" (add pod name, namespace metadata)
#     OUTPUT: "Deliver it all to CloudWatch" (ship to AWS)
#
# Configuration has 3 stages:
#   [INPUT]  → where to read logs from
#   [FILTER] → enrich logs with Kubernetes metadata (pod name, namespace, etc.)
#   [OUTPUT] → where to send the enriched logs
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
  labels:
    app: fluent-bit

data:
  # ── MAIN CONFIGURATION FILE ──────────────────────────────────
  fluent-bit.conf: |

    # ── SERVICE SETTINGS ─────────────────────────────────────
    # Global Fluent Bit settings.
    # Flush: ship logs to CloudWatch every 5 seconds (not immediately — batching is more efficient)
    # Log_Level: info — only log Fluent Bit's own activity (not DEBUG which would be noisy)
    [SERVICE]
        Flush         5
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    # ── INPUT: READ LOG FILES FROM DISK ─────────────────────
    # Kubernetes writes every container's stdout/stderr as log files here:
    #   /var/log/containers/<pod-name>_<namespace>_<container-name>-<id>.log
    #
    # "tail" means: keep reading new lines as they appear (like "tail -f").
    # Tag: kube.* — all these logs get tagged so the filter/output knows where they came from.
    # DB: tracks which log lines have already been sent — so if Fluent Bit restarts,
    #     it picks up where it left off (no duplicate or missed logs).
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        # Don't read Fluent Bit's own logs — that would create an infinite loop!
        Exclude_Path      /var/log/containers/fluent-bit*

    # ── FILTER: ENRICH WITH KUBERNETES METADATA ─────────────
    # This step looks up the Kubernetes API to find metadata about each pod:
    #   - pod name
    #   - namespace
    #   - container name
    #   - labels (like "component: backend")
    #   - node name
    #
    # These get added to every log line. This is what lets you filter
    # in CloudWatch: "show me all logs from namespace=expense" or
    # "show me all logs from component=backend"
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    # ── OUTPUT: SEND TO CLOUDWATCH ───────────────────────────
    # Send all matched logs to CloudWatch.
    #
    # log_group_name: the "filing cabinet" — /expense/dev/application
    # log_stream_prefix: one stream per pod (pod/expense-backend-abc123-xyz)
    #   This keeps pod logs separated so you can read one pod at a time.
    # auto_create_group: Off — we pre-create groups in Terraform for better control
    # region: us-east-1 — must match where EKS and CloudWatch are deployed
    [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.*
        region              us-east-1
        log_group_name      /expense/dev/application
        log_stream_prefix   pod/
        auto_create_group   Off

  # ── LOG PARSERS ──────────────────────────────────────────────
  # Parsers tell Fluent Bit how to understand different log formats.
  # Docker wraps logs in JSON: {"log":"...", "stream":"stdout", "time":"..."}
  # CRI (Kubernetes) uses a different format: <timestamp> <stream> <flags> <log>
  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
