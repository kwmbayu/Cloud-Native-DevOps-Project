# ============================================================
# FLUENT BIT SERVICE ACCOUNT
#
# What a ServiceAccount is:
#   Every Kubernetes pod runs as a "service account" — like an employee badge.
#   By default, pods get a guest badge with no AWS permissions.
#
#   This ServiceAccount is special: it's annotated with an AWS IAM role ARN.
#   This annotation tells Kubernetes: "when a pod uses this service account,
#   inject the IAM role credentials automatically."
#
#   This technique is called IRSA (IAM Roles for Service Accounts).
#   It means Fluent Bit never needs a username/password or access key —
#   it automatically gets temporary AWS credentials tied to the exact
#   permissions it needs (and nothing else).
#
# HOW TO FILL IN THE ARN:
#   After running "terraform apply" in terraform/70-monitoring/,
#   the terminal will print: fluent_bit_role_arn = "arn:aws:iam::258464457244:..."
#   OR run: aws ssm get-parameter --name /expense/dev/fluent_bit_role_arn
#
#   Replace FLUENT_BIT_ROLE_ARN below with that value.
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
  annotations:
    # IRSA annotation — this is the magic that connects Kubernetes identity to AWS IAM
    eks.amazonaws.com/role-arn: "FLUENT_BIT_ROLE_ARN"
    #
    # After terraform apply runs, replace FLUENT_BIT_ROLE_ARN with the real ARN.
    # It looks like: arn:aws:iam::258464457244:role/expense-dev-fluent-bit
    #
    # You can get it by running:
    #   aws ssm get-parameter --name /expense/dev/fluent_bit_role_arn --query Parameter.Value --output text
  labels:
    app: fluent-bit
